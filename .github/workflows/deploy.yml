name: Deploy Acsius Website

on:
  push:
    branches:
      - main

concurrency:
  group: acsius-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: acsius
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /home/acsius/deploy.sh
